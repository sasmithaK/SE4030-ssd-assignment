# [VULN-2] SECURITY ISSUE - MongoDB credentials hardcoded and exposed in git history
# This URI contains live username:password (dinithi:root) - must move to env variable
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=restaurant_db2

server.port=8082
 
# Google OAuth2 Credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email 
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8082/login/oauth2/code/google}

app.frontend.oauth-redirect=${APP_FRONTEND_OAUTH_REDIRECT_URL:http://localhost:3000/oauth2/redirect}